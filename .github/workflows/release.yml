name: release
on:
  push:
    tags: ["v2.*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version matches tag
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build packages
        run: dotnet run --project packaging/Iato.Packaging -c Release
      - name: Packages install and run
        run: |
          sudo apt-get install -y ./dist/iato_*_amd64.deb
          test "$(iato version)" = "$(cat VERSION)"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
              --title "Intent-Auditable Trust Object V2 ${GITHUB_REF_NAME}" --notes-from-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
