# Alternative domain: users provisioned from Entra ID into OpenLDAP
# (inetOrgPerson + posixAccount), read by SSSD over LDAPS.
[domain/openldap]
id_provider = ldap
auth_provider = ldap
access_provider = ldap
ldap_uri = ldaps://ldap.example.internal
ldap_search_base = dc=example,dc=internal
ldap_default_bind_dn = cn=sssd,ou=service,dc=example,dc=internal
ldap_default_authtok = __BIND_PASSWORD__
ldap_tls_reqcert = demand
ldap_tls_cacert = /etc/ssl/certs/ca-certificates.crt
ldap_schema = rfc2307bis
ldap_group_member = member
ldap_access_filter = memberOf=cn=linux-login,ou=groups,dc=example,dc=internal
cache_credentials = true
