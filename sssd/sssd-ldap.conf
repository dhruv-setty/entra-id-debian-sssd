# /etc/sssd/sssd.conf  (owner root:root, mode 0600)
# Users and groups provisioned from Entra ID into OpenLDAP (inetOrgPerson +
# posixAccount), read by SSSD over LDAPS. Works on any SSSD in Debian 12 or later.
[sssd]
services = nss, pam, ssh
domains = openldap

[nss]
default_shell = /bin/bash
fallback_homedir = /home/%u

[domain/openldap]
id_provider = ldap
auth_provider = ldap
access_provider = ldap
ldap_uri = __LDAP_URI__
ldap_search_base = __SEARCH_BASE__
ldap_default_bind_dn = __BIND_DN__
ldap_default_authtok = __BIND_PASSWORD__
ldap_tls_reqcert = demand
ldap_tls_cacert = /etc/ssl/certs/ca-certificates.crt
ldap_schema = rfc2307bis
ldap_group_member = member
# Only members of this group (a DN) may log in.
ldap_access_filter = memberOf=__ALLOWED_GROUP__
# Offline logins keep working when the directory is unreachable.
cache_credentials = true
enumerate = false
